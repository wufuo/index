<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情侣纪念页 PG版</title>
<!-- 引入TCB RDB PG SDK -->
<script src="https://cdn.jsdelivr.net/npm/@cloudbase/js-sdk@2.10.0/dist/cloudbase.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#fff0f5;padding:20px;max-width:900px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #00000012}
h2{color:#c85a7a;margin-bottom:12px;font-size:20px}
input,textarea{width:100%;padding:10px;border:1px solid #f0c8d2;border-radius:8px;margin:8px 0}
button{background:#e87897;color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;margin:4px}
button:hover{background:#d65c7c}
.item{padding:10px;border-bottom:1px solid #f8e2e8;display:flex;justify-content:space-between;align-items:center}
.done{text-decoration:line-through;color:#999}
</style>
</head>
<body>
<div class="card">
  <h2>📅 纪念日</h2>
  <div id="anniversaryList"></div>
  <input id="anniName" placeholder="纪念日名称">
  <input id="anniDate" type="date">
  <button onclick="addAnniversary()">新增纪念日</button>
</div>

<div class="card">
  <h2>✅ 情侣待办</h2>
  <div id="todoList"></div>
  <input id="todoInput" placeholder="写下待办">
  <button onclick="addTodo()">添加待办</button>
</div>

<div class="card">
  <h2>💌 心愿清单</h2>
  <div id="wishList"></div>
  <div id="wishList"></div>
  <input id="wishInput" placeholder="心愿">
  <button onclick="addWish()">添加心愿</button>
</div>

<div class="card">
  <h2>📖 回忆记录</h2>
  <div id="memoryList"></div>
  <input id="memTitle" placeholder="标题">
  <textarea id="memDesc" placeholder="描述"></textarea>
  <input id="memDate" type="date">
  <button onclick="addMemory()">添加回忆</button>
</div>

<div class="card">
  <h2>💬 留言板</h2>
  <div id="msgList"></div>
  <input id="msgAuthor" placeholder="昵称">
  <textarea id="msgContent" placeholder="留言"></textarea>
  <button onclick="addMessage()">留言</button>
</div>

<script>
// ========= 这里改成你自己的参数！！ =========
const envId = "你的环境ID";
const accessKey = "你的publish_key";
// ==========================================

const { cloudbase } = window;
const app = cloudbase.init({
  env: envId,
  accessKey: accessKey
});
let db = null;

// 初始化 + 匿名登录
async function initTCB() {
  try {
    // 匿名登录
    await app.auth.signInAnonymously();
    db = app.rdb();
    console.log("✅ 登录成功，PG数据库就绪");
    loadAllData();
  } catch (err) {
    console.error("初始化失败", err);
    alert("TCB初始化失败，请检查环境、accessKey、匿名登录开关");
  }
}
// 一次性加载全部数据
async function loadAllData() {
  await renderAnniversary();
  await renderTodo();
  await renderWish();
  await renderMemory();
  await renderMessage();
}

// ---------------- 纪念日 ----------------
async function renderAnniversary() {
  const {data,error} = await db.from("anniversary").select("*").order("target_date");
  if(error) return console.error(error);
  const wrap = document.getElementById("anniversaryList");
  wrap.innerHTML = "";
  data.forEach(item=>{
    wrap.innerHTML += `<div class="item">${item.name}｜${item.target_date} <button onclick="delAnni(${item.id})">删除</button></div>`
  })
}
async function addAnniversary(){
  const name = document.getElementById("anniName").value.trim();
  const date = document.getElementById("anniDate").value;
  if(!name||!date) return alert("填写完整");
  await db.from("anniversary").insert({name,target_date:date});
  document.getElementById("anniName").value="";
  document.getElementById("anniDate").value="";
  renderAnniversary();
}
async function delAnni(id){
  await db.from("anniversary").delete().eq("id",id);
  renderAnniversary();
}

// ---------------- 待办Todo ----------------
async function renderTodo() {
  const {data,error} = await db.from("lovetodo").select("*").order("created_at",{ascending:false});
  if(error) return console.error(error);
  const wrap = document.getElementById("todoList");
  wrap.innerHTML = "";
  data.forEach(item=>{
    wrap.innerHTML += `<div class="item ${item.done?'done':''}">${item.content}
      <div>
        <button onclick="toggleTodo(${item.id},${!item.done})">完成</button>
        <button onclick="delTodo(${item.id})">删除</button>
      </div>
    </div>`
  })
}
async function addTodo(){
  const content = document.getElementById("todoInput").value.trim();
  if(!content) return;
  await db.from("lovetodo").insert({content,done:false});
  document.getElementById("todoInput").value="";
  renderTodo();
}
async function toggleTodo(id,val){
  await db.from("lovetodo").update({done:val}).eq("id",id);
  renderTodo();
}
async function delTodo(id){
  await db.from("lovetodo").delete().eq("id",id);
  renderTodo();
}

// ---------------- 心愿 Wish ----------------
async function renderWish() {
  const {data,error} = await db.from("wish").select("*").order("created_at",{ascending:false});
  if(error) return console.error(error);
  const wrap = document.getElementById("wishList");
  wrap.innerHTML = "";
  data.forEach(item=>{
    wrap.innerHTML += `<div class="item ${item.finish?'done':''}">${item.content}
      <div>
        <button onclick="toggleWish(${item.id},${!item.finish})">完成</button>
        <button onclick="delWish(${item.id})">删除</button>
      </div>
    </div>`
  })
}
async function addWish(){
  const content = document.getElementById("wishInput").value.trim();
  if(!content) return;
  await db.from("wish").insert({content,finish:false});
  document.getElementById("wishInput").value="";
  renderWish();
}
async function toggleWish(id,val){
  await db.from("wish").update({finish:val}).eq("id",id);
  renderWish();
}
async function delWish(id){
  await db.from("wish").delete().eq("id",id);
  renderWish();
}

// ---------------- 回忆 Memory ----------------
async function renderMemory() {
  const {data,error} = await db.from("memory").select("*").order("event_date",{ascending:false});
  if(error) return console.error(error);
  const wrap = document.getElementById("memoryList");
  wrap.innerHTML = "";
  data.forEach(item=>{
    wrap.innerHTML += `<div class="item">
      <div><b>${item.title}</b><br>${item.descr}<br>${item.event_date||""}</div>
      <button onclick="delMemory(${item.id})">删除</button>
    </div>`
  })
}
async function addMemory(){
  const title = document.getElementById("memTitle").value.trim();
  const descr = document.getElementById("memDesc").value.trim();
  const event_date = document.getElementById("memDate").value;
  if(!title||!descr) return alert("标题和描述必填");
  await db.from("memory").insert({title,descr,event_date});
  document.getElementById("memTitle").value="";
  document.getElementById("memDesc").value="";
  document.getElementById("memDate").value="";
  renderMemory();
}
async function delMemory(id){
  await db.from("memory").delete().eq("id",id);
  renderMemory();
}

// ---------------- 留言 Message ----------------
async function renderMessage() {
  const {data,error} = await db.from("message").select("*").order("created_at",{ascending:false});
  if(error) return console.error(error);
  const wrap = document.getElementById("msgList");
  wrap.innerHTML = "";
  data.forEach(item=>{
    wrap.innerHTML += `<div class="item"><b>${item.author||"匿名"}</b>：${item.content}<button onclick="delMsg(${item.id})">删除</button></div>`
  })
}
async function addMessage(){
  const author = document.getElementById("msgAuthor").value.trim();
  const content = document.getElementById("msgContent").value.trim();
  if(!content) return alert("留言内容不能为空");
  await db.from("message").insert({author,content});
  document.getElementById("msgAuthor").value="";
  document.getElementById("msgContent").value="";
  renderMessage();
}
async function delMsg(id){
  await db.from("message").delete().eq("id",id);
  renderMessage();
}

window.onload = initTCB;
</script>
</body>
</html>
